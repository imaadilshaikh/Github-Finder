    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const themeIcon = document.querySelector(".theme-icon");
        const themeLabel = document.querySelector(".theme-label");
        const searchbtn = document.querySelector("#getpro")
        const cardUI = document.querySelector("#card")


        function cardHTML() {
            return `
             <div id="card" class="mt-12 px-4 md:px-12 flex justify-center items-center">
        <div
            class="bg-white dark:bg-[#242323] text-gray-800 dark:text-white rounded-2xl border border-[#1b5ff1] shadow-[10px_10px_20px_rgba(33,54,241,0.15)] flex flex-col md:flex-row p-8 font-medium text-[1.1rem] max-w-4xl w-full transition-all duration-300">
            <!-- Image -->
            <div class="flex justify-center md:block">
                <img class="w-[100px] h-[100px] rounded-full border-2 border-[#f11b2d] md:mr-8"
                    src="${user.avatar_url}" alt="Profile">
            </div>
            <!-- Info -->
            <div class="right mt-4 md:mt-0 text-gray-700 dark:text-gray-200">
                <h1 class="text-3xl font-semibold text-gray-900 dark:text-white">
                    ${user.name}
                </h1>
                <p class="text-gray-500 dark:text-gray-400">
                    ${user.login}
                </p>
                <p class="text-gray-500 dark:text-gray-400">
                    ${user.bio}
                </p>
                <div class="flex gap-4 mt-3 flex-wrap text-gray-700 dark:text-gray-200">
                    <h4 class="flex gap-1 items-center">
                        <span>Public Repos:</span>
                        <span class="text-gray-900 dark:text-white font-semibold">${user.public_repos}</span>
                    </h4>
                    <h4 class="flex gap-1 items-center">
                        <span>Followers:</span>
                        <span class="text-gray-900 dark:text-white font-semibold">${user.followers}</span>
                    </h4>
                    <h4 class="flex gap-1 items-center">
                        <span>Following:</span>
                        <span class="text-gray-900 dark:text-white font-semibold">${user.following}</span>
                    </h4>
                    <h4 class="flex gap-1 items-center">
                        <span>Location:</span>
                        <span class="text-gray-900 dark:text-white font-semibold">${user.location}</span>
                    </h4>
                </div>
                <div class="flex gap-4 mt-3 flex-wrap text-gray-700 dark:text-gray-200">
                    <h4 class="flex gap-1 items-center">
                        <span>Company:</span>
                        <span class="text-gray-900 dark:text-white font-semibold">${user.company}</span>
                    </h4>

                    <h4 class="flex gap-1 items-center flex-wrap">
                        <span>Blog:</span>

                        <a href="https://aadilshaikhportfolio.antideploy.com" target="_blank" rel="noreferrer"
                            class="text-[#1b5ff1] hover:underline break-all">
                            ${user.blog}
                        </a>
                    </h4>
                </div>
            </div>
        </div>
    </div>`
        }

        function usernotfound() {
            return `
            <div class="bg-white dark:bg-[#242323] text-gray-800 dark:text-white rounded-2xl border border-[#f11b2d] shadow-[10px_10px_20px_rgba(241,27,45,0.15)] flex flex-col items-center text-center p-8 max-w-md w-full transition-all duration-300">
        
                <div class="text-5xl mb-3">🔍</div>

                <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">
                    User Not Found
                </h2>

                <p class="mt-2 text-gray-500 dark:text-gray-400">
                    Koi GitHub user is username se nahi mila. Spelling check karke dobara try karo.
                </p>

            </div>
            `
        }

        searchbtn.addEventListener('click', function () {

            const username = text.value.trim();
            if (username === "") {
                alert("Please Enter the username")
                return;
            }

            fetch(`https://api.github.com/users/${username}`)
                .then((raw) => {
                    if (!raw.ok) {
                        throw new Error("User not found")
                    }
                    return raw.json();
                })
                .then((data) => {
                    user = data;
                    cardUI.innerHTML = cardHTML();
                })
                .catch((err) => {
                    console.log(err);
                    cardUI.innerHTML = usernotfound();
                })
        });


        // Theme

        function theme() {

            function applyTheme(theme) {
                const isDark = theme === "dark";
                document.documentElement.classList.toggle("dark", isDark);

                if (themeIcon) {
                    themeIcon.textContent = isDark ? "☀️" : "🌙";
                }

                if (themeLabel) {
                    themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
                }

                if (themeToggle) {
                    themeToggle.setAttribute("aria-pressed", String(isDark));
                }
            }

            function getPreferredTheme() {
                try {
                    const savedTheme = localStorage.getItem("theme");
                    if (savedTheme === "dark" || savedTheme === "light") {
                        return savedTheme;
                    }
                } catch (error) {
                    console.warn("Unable to access localStorage:", error);
                }

                return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }

            function initTheme() {
                applyTheme(getPreferredTheme());
            }

            if (themeToggle) {
                themeToggle.addEventListener("click", () => {
                    const nextTheme = document.documentElement.classList.contains("dark") ? "light" : "dark";
                    applyTheme(nextTheme);

                    try {
                        localStorage.setItem("theme", nextTheme);
                    } catch (error) {
                        console.warn("Unable to save theme to localStorage:", error);
                    }
                });
            }

            initTheme();
        }

        theme();


    </script>
